[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-srm"
version = "1.0.0"
description = "Deep Learning Based Super Resolution Mapping (SRM) from Medium Resolution Satellite Imageries (Sentinel-2 L2A to sub-4m)"
readme = "README.md"
authors = [{ name = "NTRO SRM Engineering Team", email = "srm-team@ntro.gov.in" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pillow>=9.5.0",
    "pyyaml>=6.0",
    "opencv-python>=4.7.0",
    "shapely>=2.0.0",
    "geopandas>=0.13.0",
    "pyproj>=3.5.0",
    "requests>=2.28.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "einops>=0.6.0",
]
gis = [
    "rasterio>=1.3.0",
    "tifffile>=2023.4.0",
    "imageio>=2.28.0",
]
app = [
    "streamlit>=1.24.0",
    "matplotlib>=3.7.0",
    "plotly>=5.14.0",
]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]
all = [
    "satellite-srm[ml,gis,app,dev]"
]

[project.scripts]
satellite-srm = "satellite_srm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
