# Training Engine Configuration
batch_size: 4
num_workers: 2
epochs: 50
learning_rate: 1.0e-4
min_learning_rate: 1.0e-6
weight_decay: 1.0e-4
gradient_accumulation_steps: 2
max_grad_norm: 1.0

optimizer: "AdamW"
scheduler: "CosineAnnealingLR"
warmup_epochs: 3

mixed_precision: true  # FP16 autocast on CUDA
use_ema: true
ema_decay: 0.999

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.001
  monitor: "val_psnr"
  mode: "max"

loss_weights:
  l1: 1.0
  perceptual: 0.1
  spectral_ratio: 0.25
  ndvi: 0.50

checkpoint:
  save_interval_epochs: 5
  keep_top_k: 3
